# MJPC lower-body deploy — REAL H1-2 params (mirror of the fork's validated B1
# rung: RW-EKF estimator in the loop, robot NIC auto-pinned by the core).
# Differences vs mjpc_sim.yaml: twin_dt matches the real 1 kHz lowstate tick,
# the measured IMU pitch mount calibration is applied, and there is no elastic
# band. See the submodule's mjpc/deploy/deploy_common.h for the compiled-in
# settled values and Command_Sheet_h12.html for the native-h12 equivalents.

h12_deploy_mjpc_estimator:
  ros__parameters:
    # Debug mode has no sport service, so the estimator OWNS rt/sportmodestate
    # (the native-B1 arrangement). Never run a second estimator instance.
    out_topic: rt/sportmodestate
    rate: 200.0
    filter: rw-ekf
    # Pin the robot-subnet NIC explicitly. The estimator's Python auto-pin
    # (`ip -o -4 addr show`, matching 192.168.123.x) fell back to "twin only"
    # in the container even though the C++ core's getifaddrs found this NIC --
    # so on real HW it must be forced or the estimator never binds rt/lowstate.
    # Change to your adapter if different (`ip -o -4 addr show` on the robot subnet).
    iface: enx00e04c681314

mjpc_deploy_lowerbody_controller:
  ros__parameters:
    task: "Stabilize H12 Magpie"
    strategy: 6                 # 6 = stand
    gravity_ff: 0.85            # real robot: validated value
    twin_dt: 0.001              # real lowstate ticks at 1 kHz
    sportstate_topic: rt/sportmodestate
    # MEASURED mount calibration for THIS H1-2 (body truly vertical reads -1.6
    # deg on the IMU; +1.6 zeroes it). Validated on real hardware.
    imu_pitch_offset_deg: 1.6
    arm_aware: true
    drop_band: false            # no elastic band outside sim
