# Full-body MJPC stand params for the REAL H1-2 (h1_real_fullbody_bringup.launch.py).
# Real-robot twin of mjpc_fullbody.yaml: the WHOLE-BODY core (nu=27, Lean task,
# the validated real-robot stand) but with the real numerics from mjpc_real.yaml
# (1 kHz lowstate tick, measured IMU mount calibration, no elastic band, latency
# comp at unity since real runs ~1x). See the submodule's mjpc/deploy/
# deploy_common.h for the compiled-in settled values and Command_Sheet_h12.html
# for the native-h12 equivalents (Lean --strategy 6 --gravity_ff 0.85 --twin_dt 0.001).

h12_deploy_mjpc_estimator:
  ros__parameters:
    # Debug mode has no sport service, so the estimator OWNS rt/sportmodestate
    # (the native-B1 arrangement, identical to the lower-body real bringup).
    # Never run a second estimator instance (e.g. the laptop base_estimator_node).
    out_topic: rt/sportmodestate
    rate: 200.0
    filter: rw-ekf
    # tick_dt left unset: real runs at 1x, so wall == plant time (only the
    # far-below-realtime RoboCasa sim needs the plant-clock override).

mjpc_deploy_lowerbody_controller:
  ros__parameters:
    controller_exe: mjpc_fullbody_core   # the whole-body h12_control_node core
    task: "Lean H12 Magpie"              # full-body task; strategy 6 = stand
    strategy: 6
    gravity_ff: 0.85            # real robot: validated value (the 444 s stand)
    twin_dt: 0.001              # real lowstate ticks at 1 kHz
    sportstate_topic: rt/sportmodestate
    # MEASURED mount calibration for THIS H1-2 (body truly vertical reads -1.6
    # deg on the IMU; +1.6 zeroes it). Validated on real hardware.
    imu_pitch_offset_deg: 1.6
    has_arm_aware: false        # full node owns the arms + has no --arm_aware flag; suppress it
    # stale_sec left unset -> compiled default 0.05 (real DDS is 1x, no sim freezes).
    latency_rtf: 1.0            # real runs ~1x: identity (byte-unchanged latency comp)
    drop_band: false           # no elastic band outside sim
