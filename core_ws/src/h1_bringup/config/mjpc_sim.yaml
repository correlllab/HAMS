# MJPC lower-body deploy — RoboCasa SIM params (h1_sim_bringup.launch.py).
# Controller + estimator are the fork's deploy core
# and RW-EKF base estimator behind the h12_deploy_mjpc shims; these params
# mirror the fork's surviving CLI flags 1:1. Everything settled (ctrl 200 Hz,
# twin-time clocking, latency comp, ramp/hold/blend timings, torque-budget
# clamp, watchdog) is compiled into the core — see the submodule's
# mjpc/deploy/deploy_common.h.

h12_deploy_mjpc_estimator:
  ros__parameters:
    # Side topic (nothing else publishes sportmodestate in sim, but the side
    # topic keeps the one-writer rule trivially safe). Controller reads it below.
    out_topic: rt/sportmodestate_est
    rate: 200.0
    filter: rw-ekf
    # PLANT-CLOCK the filter (plant seconds per lowstate tick = RoboCasa's
    # model.opt.timestep). The wall-clocked default over-integrates by 1/RTF on
    # this far-below-realtime sim — measured take 3 (2026-07-03): odometric xy
    # drifted ~4x the robot's true motion, feeding the planner an inconsistent
    # (pos, vel) pair -> lateral divergence within seconds of policy authority.
    # REAL runs 1x, where wall == plant time; mjpc_real.yaml leaves this at 0.
    tick_dt: 0.005   # follows --sim-dt 0.005 (plant timestep parity, 2026-07-04)

mjpc_debug_visualizer:
  ros__parameters:
    # DEBUG ONLY (use_mjpc_viz:=false to drop it). Renders the MEASURED robot in its
    # normal colours + a semi-transparent BLUE GHOST at the planner's current best
    # trajectory, and writes the mp4 when the node is signalled. Commands nothing;
    # subscribes only to rt/lowstate, the estimator's rt/sportmodestate_est, and
    # rt/mjpc/plan (the controller core publishes that from its planner thread --
    # controller_launcher.py hardcodes --plan_topic, so this needs no arming here).
    # MUST be a HOST-MOUNTED path. docker_run.sh runs the ros container with
    # `compose run --rm`, so the container -- and everything in its /tmp -- is
    # DESTROYED the moment `ros2 launch` exits. That is exactly when the mp4 is
    # finalised, so a /tmp default writes a perfect video and then deletes it.
    # core_ws is bind-mounted, and core_ws/.gitignore's `log/` has no leading slash
    # so it matches at ANY depth -- this lands on the host at
    # core_ws/src/h12_deploy_mjpc/log/mjpc_plan.mp4 and stays out of git.
    out_path: /home/code/core_ws/src/h12_deploy_mjpc/log/mjpc_plan.mp4
    # RENDER rate, decoupled from the 200 Hz lowstate and the ~20 Hz plan (the viewer
    # draws from whatever it last cached, on its own clock). 10 because osmesa is a
    # software rasteriser: ~96 ms/frame for this scene with shadows off (measured),
    # i.e. ~10 fps, and the mp4's fps tag is fixed when the file opens -- so a target
    # the loop cannot hit yields a video that PLAYS FAST and misrepresents the
    # dynamics. The node reports the achieved rate on exit if it falls short.
    fps: 10.0
    width: 960
    height: 720
    # Guard an unattended sim from filling the disk. 0 = run until shutdown.
    max_seconds: 0.0
    # EXPECT the ghost's BASE to sit off the measured robot's: the plan carries the
    # PLANNER's base belief, the measured robot the ESTIMATOR's. That gap is real
    # signal (it is how you see the planner solving for a robot that isn't where it
    # thinks it is), so align_ghost_base stays false. Set true ONLY to compare
    # POSTURE in isolation.
    align_ghost_base: false
    # GHOST MOTION. sweep = the ghost's plan step cycles 0 -> end of horizon in real
    # time (each ~1 s loop walks from "now" out to the full lookahead), alpha fading
    # from ghost_rgba's alpha down to ghost_alpha_far so a single frame still shows how
    # far ahead it is. Do NOT use ghost_mode: single with ghost_step: 0 -- plan row 0
    # is the measured state BIT-FOR-BIT (trajectory.cc:130 seeds it from what the
    # deploy core SetState'd), so that draws a ghost welded to the robot and shows
    # nothing, even as it falls. That was this tool's original default and it made the
    # viewer look broken.
    ghost_mode: sweep
    sweep_rate: 1.0
    ghost_alpha_far: 0.15
    # HOW TO READ IT: a near-1:1 ghost on a STABLE stand is CORRECT -- over the 1.0 s
    # horizon the plan moves the base only ~1.8 cm and the 27 joints ~0.029 rad on
    # average (measured off the live CEM planner), because a balancing robot's plan
    # says "stay put". Judge the ghost DURING a fall, in the first few hundred ms:
    # that is when the plan's intended recovery diverges from what the robot actually
    # does, and that gap is the deploy gap (deploy_common.h:92-110).
    plan_stale_sec: 1.0

# LEGACY legs-only chain (mjpc_deploy_lowerbody_controller, Stabilize task) --
# unchanged values from before the split-body handover; the sim bringup now
# launches the splitbody node below, but this section keeps the legacy
# executable configured for anyone still running it. Tuning rationale for the
# shared knobs lives in the splitbody section's comments.
mjpc_deploy_lowerbody_controller:
  ros__parameters:
    task: "Stabilize H12 Magpie"
    strategy: 6                 # 6 = stand (the stabilize task's only real slot)
    plan_threads: 12
    gravity_ff: 1.0
    twin_dt: 0.005
    sportstate_topic: rt/sportmodestate_est
    imu_pitch_offset_deg: 0.0   # 1.6 is a REAL-robot IMU mount calibration; sim has none
    arm_aware: true             # legs pre-compensate for measured arm/torso motion
    stale_sec: 1.5
    drop_band: false
    band_drop_after_secs: 25.0

mjpc_deploy_splitbody_controller:
  ros__parameters:
    # Whole-body nu=27 SPLIT task (2026-07-17): the Magpie model + 15 inactive
    # upper-joint eq locks. While frame_task owns the arms (pause toggle) the
    # core engages the locks at the measured pose and plans legs-only; active
    # = identical to "Lean H12 Magpie" (locks off).
    task: "Lean H12 Magpie Split"
    strategy: 6                 # 6 = stand (lean task: balance hold at home pose)
    # Dynamic startup handshake (2026-07-17, defaults shown for visibility):
    # boot with frame_task owning the arms; once the core publishes legs and
    # /frametaskserver/upper_body_paused reads false, the launcher calls
    # /frametaskserver/toggle_pause_upperbody once and unpauses MJPC on the
    # response. handshake: false restores the static split (manual toggles).
    handshake: true
    default_upper_paused: true
    # ★ RESTORED TO 12 (2026-07-06) = PARITY WITH REAL/TWIN/OWNSIM (all run 12). The
    # old drop to 3 "faked" the per-sim-second planner rate for RoboCasa's SLOW RTF
    # (0.25: 12 threads = 4x real iters/sim-s -> over-plan wobble; 3 = ~real). BUT
    # that band-aid only fixed the PLANNER and REQUIRED staying slow, which LEFT the
    # latency compensator (deploy_common.cc:903, wall-clock dlt predicted as sim-sec)
    # over-predicting by 1/RTF -> controller<->plant OVERSHOOT/OSCILLATION. Correct
    # fix = run like real: 12 threads + RTF as near 1.0 as the box allows (HEADLESS,
    # --no-sensors, NO slowmo -> ~0.85). At 0.85: 12thr = ~65 iters/sim-s (~real's 55)
    # AND latency over-lead only 1.18x. Do NOT slow down; slowmo breaks BOTH. If 12
    # threads oversubscribe the laptop and TANK RTF (check /clock hz), drop to ~10.
    plan_threads: 12
    # PLANNER-RATE PARITY (2026-07-04, wobble root cause R1): the CEM planner
    # free-runs on wall time (~55 iters/s at 12 threads); at RoboCasa's ~0.25x
    # RTF that is ~4x more iterations per PLANT-second than twin/real -- the
    # elite-variance sampler collapses to its 0.01 rad floor on the near-static
    # state and can't see recovery candidates until the tilt re-spreads the
    # elites = the measured 5-7 plant-s wobble limit cycle. 3 threads ~= 14
    # iters/s wall ~= the twin's iterations-per-plant-second. RoboCasa BENCH
    # yamls only; twin/real chains keep --plan_threads 12.
    # BENCHED 2026-07-03 (A/B on the band-drop stand test): 0 collapses into a
    # knee-pegged crouch (z 0.64->0.51, legs under-driven -- unlike our twin,
    # this plant has NO leg gravcomp; only the two hands); 0.85 holds height
    # (z 0.91-0.99) all the way to the drop. Keep 0.85 here.
    gravity_ff: 1.0
    # gravity_ff A/B, WITH the 0.67 kg back_equipment ballast added AND rigid feet
    # (--rigid-feet, default ON in h12_mujoco.py): rigid feet ELIMINATED the topple
    # (foot-slip was the dominant driver). Residual then = a vertical SINK; take 12
    # showed gff 1.0 holds height (z~0.92 for 40s) vs gff 0.85 sinking to z 0.64.
    # So 1.0 here (full grav-comp) with the feet planted + mass matched. Remaining
    # 5-12deg tilt wobble is NOT a stand yet -- next parity lever is the global
    # integrator (RoboCasa Euler vs planner/twin implicitfast; the task XML warns
    # Euler diverges on biped balance). REAL keeps 0.85 (mjpc_real.yaml).
    # gravity_ff A/B, WITH the 0.67 kg back_equipment ballast added (takes 9-10,
    # 2026-07-03): neither 0.85 (fwd+lat fold) nor 0 (stronger LATERAL fold +
    # knee collapse) stands. The ballast is a correct parity fix but NOT the
    # dominant gap -- the fold is a lateral foot-slip, root-caused (opt dump of
    # the assembled robosuite model) to the CONTACT/INTEGRATOR mismatch:
    # RoboCasa runs impratio=20 / integrator=Euler / cone=elliptic vs the twin+
    # planner's 100 / implicitfast / pyramidal. gravity_ff is a minor amplifier;
    # keep 0.85 (matches real) until the contact model is addressed.
    # gravity_ff A/B (harness takes, 2026-07-03): 0 = knee-pegged collapse;
    # 0.85 = slow policy-commanded knee fold once the blend starts (z 1.03->0.87,
    # low knee torque -- the fold is planned, not saturated); 1.0 = height holds
    # better (z~0.97) but the tilt fight is WORSE (posture assist 80-100 Nm).
    # Neither frees the stand: the divergence starts at blend onset (twin ~5.2s)
    # in every take = the documented post-parity twin structural free-stand gap,
    # faithfully reproduced on this plant. Keep the validated 0.85.
    # MUST equal RoboCasa's model.opt.timestep: the sim publishes rt/lowstate
    # from a RecurrentThread at exactly that interval, and the core's planner
    # clock is lowstate tick * twin_dt.
    # 0.005 (2026-07-04, T2-vs-T3b): the balance bench now runs the plant at
    # the TWIN's dt via --sim-dt 0.005 -- the deploy-chain stand is
    # dt-sensitive (twin@0.002 hangs, twin@0.005 stands even at RTF 0.5).
    twin_dt: 0.005
    # ★ TWIN-PARITY A/B RESULT (2026-07-06): tested rt/sportmodestate (GROUND TRUTH,
    # plant --truth-sportstate, VERIFIED 191 Hz + controller reading it) -> did NOT
    # stop the fall. The LATERAL fold became a SAGITTAL forward->backward divergence
    # (plane-floor had already fixed lateral). So the ESTIMATOR was NOT the killer.
    # REVERTED to rt/sportmodestate_est = real-parity + the 30 ms LPF that damps the
    # raw-truth base velocity the planner over-reacts to. Re-flip to rt/sportmodestate
    # (+ plant --truth-sportstate) only to A/B raw truth again.
    sportstate_topic: rt/sportmodestate_est
    # REAL-PARITY STATE SOURCE (2026-07-05): read the RW-EKF estimate on
    # rt/sportmodestate_est — the SAME signal path the real robot uses (the
    # bringup already launches the estimator). Twin A/B at AngMom 5 showed the
    # EKF-filtered velocity gives a QUIETER stand (tilt 3-5° steady vs 5-6°
    # then fall) than raw truth: the earlier --truth-sportstate override was a
    # self-inflicted parity gap (truth = full-bandwidth velocity the planner
    # over-reacts to; the 30 ms LPF matches real). The EKF's leg-odometry xy
    # wanders ~0.3 m under sim foot micro-slip, but for STANDING xy position is
    # irrelevant (balance = orientation + base velocity + CoM). Set this back to
    # rt/sportmodestate (+ sim --truth-sportstate) only to A/B raw truth again.
    imu_pitch_offset_deg: 0.0   # 1.6 is a REAL-robot IMU mount calibration; sim has none
    arm_aware: true             # legs pre-compensate for measured arm/torso motion
    # With the FULL sensor set on, each 10 Hz(sim) lidar+camera cycle holds
    # the sim lock for up to ~1 s of wall on a laptop -- and mj_step + the
    # lowstate publisher pause WITH it, so sim time itself freezes: nothing
    # physical happens during the gap (measured: thresholds 0.05/0.15/0.25/0.5
    # ALL tripped just past their value once per sensor cycle -- each print is
    # a lower bound, the freeze outlasted every one of them). The threshold
    # must sit ABOVE the freeze ceiling or every sensor cycle injects a
    # mid-freeze damping blip into the command stream. 1.5 rides the freezes
    # out and still catches a genuinely dead publisher; the bring-up script is
    # plant-clocked, so it pauses during each freeze rather than racing ahead.
    # REAL stays at the compiled 0.05 (mjpc_real.yaml doesn't set this).
    stale_sec: 1.5
    # Band release is owned by the SIM's slack-triggered auto-release
    # (h12_mujoco --band-auto-release: |band force| <= 30 N sustained 2 sim-s,
    # the twin harness "handoff-timing" doctrine -- a self-supporting robot
    # leaves the band slack). Keep the launcher's TIMER release OFF: the
    # /elastic_band/toggle service is a stateful TOGGLE, so firing it after
    # the sim already auto-released would turn the band back ON. (Timer
    # releases were also benched dishonest: they fire mid-sway and dump the
    # robot from whatever posture the tether wound it into.)
    drop_band: false
    band_drop_after_secs: 25.0
