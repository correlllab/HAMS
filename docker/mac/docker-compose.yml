# ==============================
# Apple-Silicon (arm64) / CPU-only compose for GOLEM.
# Standalone file (NOT an override) so the NVIDIA runtime, GPU env vars, and
# /dev/dri | /dev/input | X11 device mounts from docker-compose.yml are simply
# absent. Runs headless under Colima. Isaac is intentionally omitted.
#
#   docker compose -f docker/mac/docker-compose.yml build robocasa
#   docker compose -f docker/mac/docker-compose.yml run --rm robocasa
# ==============================
services:
  robocasa:
    container_name: golem_sim_robocasa
    build:
      context: ../..
      dockerfile: docker/mac/RobocasaDockerfile.arm64
    image: golem_sim_robocasa:latest
    shm_size: 8g
    # Share one network namespace so robocasa and ros see each other's DDS
    # discovery on the same ROS_DOMAIN_ID.
    network_mode: host
    # Share the host IPC namespace (=> shared /dev/shm) so FastDDS's shared-memory
    # data transport works ACROSS the two containers. Without this, discovery
    # (UDP) matches but data is silently dropped — the sim never receives /lowcmd
    # and rclpy subscribers get nothing. (x86 uses CycloneDDS/UDP and dodges this;
    # the arm64 port is on FastDDS, which prefers SHM for same-host peers.)
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - MUJOCO_GL=osmesa
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # Display mode for the MuJoCo sim. Default headless (OSMesa, no window).
      # Set GOLEM_DISPLAY=vnc to render the interactive viewer with software GL
      # (llvmpipe) into an in-container Xvfb and stream it over VNC/noVNC — the
      # only way to see the MuJoCo GUI on Apple Silicon, since its GL window
      # cannot forward to XQuartz. View it with docker/mac/scripts/mac_vnc_tunnel.sh:
      #   GOLEM_DISPLAY=vnc docker compose -f docker/mac/docker-compose.yml up robocasa
      - GOLEM_DISPLAY=${GOLEM_DISPLAY:-headless}
      # GOLEM_CAMERAS=0 drops the 3 RGBD camera renders (the heaviest per-step CPU
      # cost) to speed the sim up for locomotion/SLAM. Lidar + odom are unaffected.
      - GOLEM_CAMERAS=${GOLEM_CAMERAS:-1}
      # GOLEM_SIM_ODOM=1 publishes ground-truth base odometry (odom -> pelvis TF +
      # /odom) straight from the sim, feeding 2D SLAM without FAST-LIO. Default 0
      # (off) so the shared sim bridge stays silent; the nav/SLAM demo sets it to 1
      # (see docs/NAVIGATION_DEMO.md).
      - GOLEM_SIM_ODOM=${GOLEM_SIM_ODOM:-0}
      # GOLEM_SPAWN_BACKOFF (metres) backs the robot off the counter into open floor
      # at spawn (default 0 = at the counter for manipulation). 1.5-2.0 gives nav2
      # room to plan and keeps FAME from leaning into a nearby counter. NOTE: baked
      # at container-create -- change it with `up --force-recreate`, not `restart`.
      - GOLEM_SPAWN_BACKOFF=${GOLEM_SPAWN_BACKOFF:-0}
      # rclpy runs on FastDDS so it does not load a 2nd CycloneDDS libddsc
      # alongside unitree_sdk2py's (arm64 in-process coexistence fix).
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ../../h1_robocasa:/home/code/h1_robocasa
      - ../../CL_Assets:/home/code/CL_Assets:ro
      - ./scripts:/home/code/h12_sim_scripts
      - ../../container_cache/msgs_ws:/home/code/msgs_ws:rw
      - ../../core_ws/src/magpie_msgs:/home/code/msgs_ws/src/magpie_msgs:ro
      - ../../core_ws/src/custom_ros_messages:/home/code/msgs_ws/src/custom_ros_messages:ro
      # colcon build/install on the VM's native ext4, NOT the virtiofs mount
      # (symlink-install onto virtiofs stalls for minutes). Persistent = cached.
      - msgs_build:/opt/msgs_ws/build
      - msgs_install:/opt/msgs_ws/install
    command: /home/code/h12_sim_scripts/launch_robocasa_mac.sh

  ros:
    container_name: golem_ros
    build:
      context: ../..
      dockerfile: docker/mac/RosDockerfile.slim.arm64
    image: golem_ros:latest
    shm_size: 4g
    network_mode: host
    # Shared IPC namespace: required for FastDDS shared-memory transport to the
    # robocasa container (see the robocasa service comment above).
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # Match the robocasa container: rclpy on FastDDS (arm64 coexistence fix).
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Set GOLEM_RVIZ=vnc to also run RViz2 (software GL -> Xvfb -> noVNC on 6081).
      # Independent of the robocasa MuJoCo viewer (GOLEM_DISPLAY=vnc, 6080), so you
      # can run either or both. View via docker/mac/scripts/mac_vnc_tunnel.sh:
      #   GOLEM_RVIZ=vnc docker compose -f docker/mac/docker-compose.yml up
      - GOLEM_RVIZ=${GOLEM_RVIZ:-0}
      # Optional lower-body controller: GOLEM_LOWERBODY=fame runs the RMA policy
      # that balances the robot standing unsupported (releases the elastic band);
      # =walk runs the raw walk policy (marches in place); =switch is the switchable
      # controller (band-held idle -> /lowerbody/start_{fame,walk}) and is the one to
      # use for stand<->walk and the nav demo -- the walk policy stays upright when
      # handed over from FAME. Default (unset) keeps the band tether + upper-body IK.
      - GOLEM_LOWERBODY=${GOLEM_LOWERBODY:-}
      # GOLEM_SLAM=1 adds pointcloud_to_laserscan + slam_toolbox to the bringup:
      # the Livox cloud -> 2D scan -> occupancy /map against the sim's /odom.
      # Needs the robocasa service started with GOLEM_SIM_ODOM=1 to supply /odom.
      - GOLEM_SLAM=${GOLEM_SLAM:-0}
      # GOLEM_NAV2=1 adds the nav2 stack (implies GOLEM_SLAM for the map): plans a
      # collision-free path on the SLAM map and drives /cmd_vel (the walk policy
      # follows it). Send goals via RViz "2D Nav Goal" or /navigate_to_pose.
      - GOLEM_NAV2=${GOLEM_NAV2:-0}
      # GOLEM_ROS_MCP=1 starts an in-container ROS debugging MCP server (warm rclpy
      # node + robot_status/wait_for/costmap/drive tools) on localhost:6082. Reach
      # it from the Mac via mac_vnc_tunnel.sh and register with:
      #   claude mcp add --transport http ros_debug http://localhost:6082/mcp
      - GOLEM_ROS_MCP=${GOLEM_ROS_MCP:-0}
      - GOLEM_ROS_MCP_PORT=${GOLEM_ROS_MCP_PORT:-6082}
    volumes:
      - ../../core_ws:/home/code/core_ws
      - ../../CL_Assets:/home/code/CL_Assets:ro
      # h12_ros2_model/setup.py locates CL_Assets as ../../../CL_Assets relative
      # to __file__, and colcon runs setup.py from the build-base — so with
      # build-base at /opt/core_ws/build that resolves to /opt/CL_Assets. Mount
      # the submodule there too so the build finds meshes/URDFs. (Installed
      # artifacts are copied into core_ws_install, so runtime is unaffected.)
      - ../../CL_Assets:/opt/CL_Assets:ro
      - ./scripts:/home/code/h12_sim_scripts
      # The ROS debug MCP server (GOLEM_ROS_MCP=1) lives in the top-level tools/
      # dir; mount it read-only so launch_ros_mac.sh can start it.
      - ../../tools:/home/code/tools:ro
      # colcon build/install on the VM's native ext4, NOT the virtiofs mount
      # (symlink-install onto virtiofs stalls for minutes). Persistent = cached.
      - core_ws_build:/opt/core_ws/build
      - core_ws_install:/opt/core_ws/install
    command: /home/code/h12_sim_scripts/launch_ros_mac.sh

# Named volumes live on the Colima VM's native ext4 — fast symlink-install and
# persistent colcon caches across `up`/`run` cycles (avoids the virtiofs stall).
volumes:
  msgs_build:
  msgs_install:
  core_ws_build:
  core_ws_install:
