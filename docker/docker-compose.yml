services:
  isaac:
    profiles: [isaac]
    container_name: hams_sim_isaac
    build:
      context: ..
      dockerfile: docker/IsaacDockerfile
    image: hams_sim_isaac:latest
    runtime: nvidia
    privileged: true
    shm_size: 16g
    # Host RAM ceiling — see the ros service below for why this exists.
    mem_limit: 10g
    mem_swappiness: 0
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - /dev/input:/dev/input:ro
      - /dev/dri:/dev/dri:rw
      - ../CL_Assets:/home/code/CL_Assets:ro
      - ./scripts:/home/code/h12_sim_scripts
      - ../CL_isaaclab_sim:/home/code/CL_isaaclab_sim
      - ../CL_isaaclab_sim/.isaac_cache/ov:/root/.cache/ov
      - ../CL_isaaclab_sim/.isaac_cache/nvidia:/root/.nv
      - ../CL_isaaclab_sim/.isaac_cache/local_share_ov:/root/.local/share/ov
      - ../CL_isaaclab_sim/.isaac_cache/isaacsim:/root/.isaacsim
    command: /home/code/h12_sim_scripts/launch_isaac.sh

  robocasa:
    profiles: [robocasa]
    container_name: hams_sim_robocasa
    build:
      context: ..
      dockerfile: docker/RobocasaDockerfile
    image: hams_sim_robocasa:latest
    runtime: nvidia
    privileged: true
    shm_size: 16g
    # Host RAM ceiling — see the ros service below for why this exists (and why
    # the SUM of the caps, not each cap alone, is what has to fit). Sim peaks
    # ~3.8g (headless, 3 cameras + video recorder), so 7g is ample headroom.
    mem_limit: 7g
    mem_swappiness: 0
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      # Default to GLFW (native passive viewer). Export MUJOCO_GL=egl on the
      # host (or pass --headless to launch_robocasa.sh) for offscreen rendering.
      - MUJOCO_GL=${MUJOCO_GL:-glfw}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # Rigid arm-only body freeze for the grasp-comparison runs (default 0 = off,
      # shipped elastic-band behavior). h12_mujoco.py reads HAMS_FREEZE_BODY.
      - HAMS_FREEZE_BODY=${HAMS_FREEZE_BODY:-0}
      # Nudge the frozen robot this many metres toward the fixture so a static
      # arm can reach it (fridge handle sits just beyond the collision-free spawn).
      - HAMS_SPAWN_FORWARD=${HAMS_SPAWN_FORWARD:-0}
      # Ignore arm/gripper geoms when backing off the fixture at spawn, so the
      # robot parks close enough for a static arm to reach it. Default 0 = off.
      - HAMS_SPAWN_ARMS_CLEAR=${HAMS_SPAWN_ARMS_CLEAR:-0}
      # One-shot ground-truth reach dump at spawn (handle/shoulder/EE world pos).
      - HAMS_DUMP_REACH=${HAMS_DUMP_REACH:-0}
      # Slide the spawn along the robot's left(+)/right(-) so the grasp shoulder
      # lines up with the target, removing the cross-body reach. 0 = centred.
      - HAMS_SPAWN_LATERAL=${HAMS_SPAWN_LATERAL:-0}
      # 'almi' = spawn legs at the ALMI policy's nominal crouch (in-place engage).
      - HAMS_STANCE=${HAMS_STANCE:-}
      # ground-truth odom -> pelvis TF (sim stand-in for FAST-LIO odometry)
      - HAMS_SIM_ODOM=${HAMS_SIM_ODOM:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - /dev/input:/dev/input:ro
      - /dev/dri:/dev/dri:rw
      - ../h1_robocasa:/home/code/h1_robocasa
      - ../CL_Assets:/home/code/CL_Assets:ro
      - ./scripts:/home/code/h12_sim_scripts
      # Only the message packages the magpi sim needs — keeps the rest of
      # core_ws (model_server weights, FAST_LIO, root-owned host build
      # dir, etc.) out of this container. The parent rw mount persists
      # build/install/log on the host under container_cache/msgs_ws/ so
      # colcon's incremental rebuild on launch is a near-no-op when the
      # IDL is unchanged; the two inner :ro mounts override their src/
      # subdirs so the package sources stay read-only.
      - ../container_cache/msgs_ws:/home/code/msgs_ws:rw
      - ../core_ws/src/magpie_msgs:/home/code/msgs_ws/src/magpie_msgs:ro
      - ../core_ws/src/custom_ros_messages:/home/code/msgs_ws/src/custom_ros_messages:ro
    command: /home/code/h12_sim_scripts/launch_robocasa.sh

  ros:
    profiles: [ros]
    container_name: hams_ros
    build:
      context: ..
      dockerfile: docker/RosDockerfile
      # MJPC_REF is exported by docker_build.sh from the mujoco_mpc submodule
      # pin (git rev-parse HEAD:mujoco_mpc); if unset, RosDockerfile's default
      # applies. This keeps the baked MJPC in lockstep with the gitlink.
      args:
        - MJPC_REF
    image: hams_ros:latest
    runtime: nvidia
    privileged: true
    shm_size: 16g
    # Host has 30 GB RAM total and only a 2 GB swapfile. The 2026-07-13 crashes
    # were host-wide OOM: an unbounded container drove anon-page usage to
    # ~29/30 GB, exhausted swap, and thrashed the desktop into a hard freeze —
    # the kernel OOM killer picked an unrelated victim (Chrome) instead of the
    # actual hog, and never got ahead of it. mem_limit gives each container its
    # own cgroup ceiling: if the ros stack (torch + SAM3 + GraspGenX + MJPC)
    # overshoots, the CONTAINER's cgroup OOM-kills it — fast and isolated —
    # instead of the host thrashing to a stop. mem_swappiness: 0 stops a
    # container from leaning on the (tiny) host swap in the first place.
    #
    # 2026-07-13 (2nd freeze): no container exceeded its cap (ros peaked 9.1/14,
    # sim 3.8/10). The host simply ran out: containers (~13g actual) + desktop
    # (~6g: chrome + vscode/cpptools + bambustu) + kernel ≈ 29 of 31.7g, and with
    # only a 2g swapfile MemAvailable fell to 605 MB and PSI-full hit 36% — a
    # hard freeze. sam_server (SAM3) is the single biggest consumer: ~7g RSS at
    # its load-time peak, INDEPENDENT of camera resolution.
    #
    # These caps are runaway CEILINGS, not reservations — actual use is ~10g
    # (ros) + ~3g (sim). Do NOT set them below the real peak: an 11g ros cap made
    # the container thrash its own cgroup reclaim during the SAM3 load and hang.
    # The load-bearing rule is that ACTUAL (containers + desktop) must fit in RAM,
    # so keep heavy desktop apps closed while the stack runs, and watch
    # MemAvailable + /proc/pressure/memory (docker/scripts/monitor_resources.sh),
    # NOT the misleading `free` column.
    mem_limit: 13g
    mem_swappiness: 0
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      # CycloneDDS runtime tuning — enlarges the UDP receive buffer so bursty
      # sensor traffic (camera images, Livox point clouds) stops overflowing the
      # socket buffer and dropping DDS fragments. Config file bind-mounted below;
      # also raise net.core.rmem_max on the host or this has no effect
      # (see README "Network / DDS tuning").
      - CYCLONEDDS_URI=file:///home/code/cyclonedds.xml
      # Gemini API key for the vision pipeline's gemini backbone + h12_skills.
      # Passed through from the host shell: export GEMINI_API_KEY before running.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Content-addressed cache for gemini_server responses, keyed on the exact
      # (prompt, image bytes). UNSET = off, which is what a real-robot bringup
      # wants (a remembered box for a moved object would be wrong). The grasp
      # benchmark exports it: a seeded sim episode renders an identical frame each
      # run, so caching gives every method a byte-identical box AND keeps a matrix
      # inside the free tier's 20-req/day quota. Lives under core_ws (bind-mounted),
      # so the cache survives container restarts between episodes.
      - GEMINI_CACHE_DIR=${GEMINI_CACHE_DIR:-}
      # GraspGenX released checkpoints ship in the repo (git-LFS) and reach the
      # container via the core_ws bind mount below. The image's
      # GRASPGENX_CHECKPOINT_DIR defaults to an empty /opt staging dir, so point
      # it at the real weights here (runtime override, no rebuild needed).
      - GRASPGENX_CHECKPOINT_DIR=/home/code/core_ws/src/model_server/weights/graspgen
      # GraspGenX gripper assets root — the dir the magpie description is staged
      # into via the bind mounts below. graspgen_server requires this explicitly.
      - GRASPGENX_ASSETS_DIR=/opt/graspgenx/assets
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - ../core_ws:/home/code/core_ws
      # CycloneDDS tuning config (see CYCLONEDDS_URI above). core_ws is already
      # mounted, but bind the file explicitly and read-only so the setting is
      # obvious and can't be clobbered from inside the container.
      - ../core_ws/cyclonedds.xml:/home/code/cyclonedds.xml:ro
      - ../CL_Assets:/home/code/CL_Assets:ro
      # Stage the magpie GraspGenX gripper description into the (image-baked)
      # GraspGenX assets so gripper_name=magpie resolves. Mount the LEAF dirs only —
      # mounting all of assets/ would shadow the baked proc_grippers/ + sample_data/.
      # gripper.urdf references ../meshes/magpie/, so the meshes leaf is mounted at
      # x_grippers/meshes/magpie (one level up from the gripper dir).
      - ../CL_Assets/graspgenx/assets/magpie:/opt/graspgenx/assets/x_grippers/magpie:ro
      - ../CL_Assets/graspgenx/assets/meshes/magpie:/opt/graspgenx/assets/x_grippers/meshes/magpie:ro
      - ./scripts:/home/code/h12_sim_scripts
      # --- MuJoCo MPC (MJPC) dev mounts -------------------------------------
      # rw SOURCE mount: the ../mujoco_mpc submodule fills the (build-time-removed)
      # clone path so the C++ agent_server / task XMLs are host-editable. The
      # importable package lives baked in dist-packages, so `import mujoco_mpc`
      # works with zero rebuild; keep this checkout pinned at MJPC_REF.
      - ../mujoco_mpc:/home/code/mujoco_mpc:rw
      # Persistent CMake build tree, nested INSIDE the source mount at the exact
      # in-tree path the image seed was built at (/home/code/mujoco_mpc/build), so
      # CMakeCache absolute paths match and setup.py's build_ext reuses it. Host
      # bytes live in gitignored container_cache/mjpc_build; launch_ros.sh hydrates
      # it from /opt/mjpc-build-seed on first launch (see msgs_ws pattern above).
      - ../container_cache/mjpc_build:/home/code/mujoco_mpc/build:rw
      # unitree_sdk2 C++ SDK install (headers + PREBUILT libunitree_sdk2.a +
      # CycloneDDS .so) for the h12_deploy_mjpc controller shim, which compiles
      # the fork's deploy core (deploy_common.cc, raw unitree_sdk2 DDS) inside
      # colcon. Hydrated by launch_ros.sh on first launch (clone + cmake
      # --install, seconds — nothing compiles, the repo ships prebuilt libs);
      # persisted here so `run --rm` containers keep it.
      - ../container_cache/unitree_install:/opt/unitree_install:rw
      # Submodule git metadata (ro): mujoco_mpc/.git is a FILE with
      # `gitdir: ../.git/modules/mujoco_mpc`, so mounting that dir at the
      # matching container path makes git work on the mounted source.
      # launch_ros.sh's hydrate needs `git diff --name-only <seed-ref>` to
      # un-backdate exactly the files that changed since the image's baked
      # build seed (otherwise a submodule ahead of MJPC_REF hydrates into a
      # silently STALE build tree).
      - ../.git/modules/mujoco_mpc:/home/code/.git/modules/mujoco_mpc:ro
    command: /home/code/h12_sim_scripts/launch_ros.sh
